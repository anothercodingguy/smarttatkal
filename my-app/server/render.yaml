services:
  - type: web
    name: smarttatkal-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smarttatkal-frontend
          property: host
      - key: LOG_LEVEL
        value: info
    autoDeploy: false